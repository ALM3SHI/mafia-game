<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAFIA 3SHI - ARCADE LOBBY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            font-family: 'Tajawal', Arial, sans-serif;
            background: #0a0e27;
            overflow: hidden;
        }
        
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
        }
        
        .hud-top {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            pointer-events: auto;
        }
        
        .hud-title {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(90deg, #ff006e, #00f5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 1, 110, 0.4);
        }
        
        .hud-room-code {
            background: rgba(255, 1, 110, 0.1);
            border: 2px solid #ff006e;
            padding: 12px 24px;
            border-radius: 8px;
            color: #00f5ff;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 2px;
        }
        
        .hud-bottom {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 0 40px;
            pointer-events: auto;
        }
        
        .hud-button {
            padding: 14px 32px;
            background: linear-gradient(135deg, #ff006e, #ff3366);
            border: 2px solid #00f5ff;
            color: white;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 1, 110, 0.3);
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        .hud-button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 40px rgba(255, 1, 110, 0.6);
        }
        
        .hud-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto;
            z-index: 5;
        }
        
        .card-name {
            font-size: 24px;
            font-weight: 800;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
            opacity: 0;
            animation: nameAppear 0.8s ease-out 1.5s forwards;
        }
        
        .card-hint {
            font-size: 14px;
            color: rgba(241, 250, 238, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            animation: hintAppear 0.8s ease-out 2.2s forwards;
        }
        
        @keyframes nameAppear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes hintAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #00f5ff;
            font-size: 20px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="ui">
        <div class="hud-top">
            <div class="hud-title">MAFIA 3SHI ARCADE</div>
            <div class="hud-room-code">غرفة: 2F4K</div>
        </div>
        <div class="hud-center">
            <div class="card-name" id="cardName">LION KNIGHT</div>
            <div class="card-hint" id="cardHint">اضغط لاختيار الشخصية</div>
        </div>
        <div class="hud-bottom">
            <button class="hud-button" onclick="previousCard()">← السابقة</button>
            <button class="hud-button" onclick="nextCard()()">التالية →</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three-postprocessing@6/build/index.js"></script>

    <script>
        // ===== CONFIGURATION =====
        const CARD_DATA = [
            { name: 'LION KNIGHT', emoji: '🦁', color: '#FFD700' },
            { name: 'DRAGON', emoji: '🐉', color: '#FF1493' },
            { name: 'PHOENIX', emoji: '🔥', color: '#FF6347' },
            { name: 'WOLF', emoji: '🐺', color: '#4169E1' },
            { name: 'TIGER', emoji: '🐯', color: '#FF8C00' }
        ];

        let currentCardIndex = 0;
        let scene, camera, renderer, card, shockwaveRing;
        let mouse = { x: 0, y: 0 };

        // ===== INITIALIZATION =====
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e27);
            scene.fog = new THREE.Fog(0x0a0e27, 50, 200);

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 2, 8);
            camera.lookAt(0, 1, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('canvas'),
                antialias: true,
                alpha: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFShadowShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;

            // ===== LIGHTING =====
            // Ambient light
            const ambientLight = new THREE.AmbientLight(0x1a2a5c, 0.4);
            scene.add(ambientLight);

            // Main spotlight
            const spotlight = new THREE.SpotLight(0x00f5ff, 1.5, 100, Math.PI / 3, 0.5, 2);
            spotlight.position.set(0, 15, 5);
            spotlight.target.position.set(0, 0, 0);
            spotlight.castShadow = true;
            spotlight.shadow.mapSize.width = 2048;
            spotlight.shadow.mapSize.height = 2048;
            scene.add(spotlight);
            scene.add(spotlight.target);

            // Neon point light (purple/blue)
            const neonLight = new THREE.PointLight(0xff006e, 1.2, 50);
            neonLight.position.set(8, 3, 8);
            scene.add(neonLight);

            const neonLight2 = new THREE.PointLight(0x00f5ff, 1, 40);
            neonLight2.position.set(-8, 3, 8);
            scene.add(neonLight2);

            // ===== TABLE GEOMETRY =====
            const tableGeometry = new THREE.PlaneGeometry(50, 50);
            const tableMaterial = new THREE.MeshStandardMaterial({
                color: 0x0a0e27,
                roughness: 0.8,
                metalness: 0.1,
                emissive: 0x1a3a5a,
                emissiveIntensity: 0.2
            });
            const table = new THREE.Mesh(tableGeometry, tableMaterial);
            table.rotation.x = -Math.PI / 2;
            table.position.y = -0.5;
            table.receiveShadow = true;
            scene.add(table);

            // ===== CARD CREATION =====
            createCard();

            // ===== SHOCKWAVE RING =====
            createShockwaveRing();

            // ===== EVENTS =====
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('click', onCardClick);
            window.addEventListener('resize', onWindowResize);

            // ===== ANIMATION LOOP =====
            animate();

            // ===== ENTRY SEQUENCE =====
            triggerEntrySequence();
        }

        // ===== CREATE 3D CARD =====
        function createCard() {
            const cardGroup = new THREE.Group();

            // Card body with rounded edges
            const cardGeometry = createRoundedBoxGeometry(3.5, 5, 0.15, 20);
            const cardMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a2a5c,
                roughness: 0.3,
                metalness: 0.7,
                emissive: 0x2a4a9c,
                emissiveIntensity: 0.3
            });
            const cardMesh = new THREE.Mesh(cardGeometry, cardMaterial);
            cardMesh.castShadow = true;
            cardMesh.receiveShadow = true;
            cardGroup.add(cardMesh);

            // Card accent (glowing edge)
            const edgeGeometry = createRoundedBoxGeometry(3.6, 5.1, 0.1, 20);
            const edgeMaterial = new THREE.MeshStandardMaterial({
                color: 0xff006e,
                emissive: 0xff006e,
                emissiveIntensity: 0.5,
                roughness: 0.2,
                metalness: 0.9
            });
            const edgeMesh = new THREE.Mesh(edgeGeometry, edgeMaterial);
            edgeMesh.position.z = 0.08;
            edgeMesh.castShadow = true;
            cardGroup.add(edgeMesh);

            // Character emoji (placeholder)
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0a0e27';
            ctx.fillRect(0, 0, 512, 512);
            
            // Draw gradient background
            const gradient = ctx.createLinearGradient(0, 0, 512, 512);
            gradient.addColorStop(0, '#1a2a5c');
            gradient.addColorStop(1, '#2a4a9c');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);

            // Draw glow
            ctx.fillStyle = 'rgba(0, 245, 255, 0.1)';
            for (let i = 0; i < 5; i++) {
                ctx.fillRect(50 + i * 30, 50 + i * 30, 400 - i * 60, 400 - i * 60);
            }

            // Draw emoji
            ctx.font = 'bold 200px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(CARD_DATA[currentCardIndex].emoji, 256, 256);

            const texture = new THREE.CanvasTexture(canvas);
            const frontMaterial = new THREE.MeshStandardMaterial({
                map: texture,
                emissive: 0x00f5ff,
                emissiveMap: texture,
                emissiveIntensity: 0.2,
                roughness: 0.4,
                metalness: 0.6
            });

            const frontGeometry = new THREE.PlaneGeometry(3.4, 4.9);
            const frontMesh = new THREE.Mesh(frontGeometry, frontMaterial);
            frontMesh.position.z = 0.1;
            frontMesh.castShadow = true;
            cardGroup.add(frontMesh);

            // Glow point light on card
            const cardLight = new THREE.PointLight(0xff006e, 0.8, 10);
            cardLight.position.z = 2;
            cardGroup.add(cardLight);

            cardGroup.position.set(0, 1, 0);
            scene.add(cardGroup);
            card = cardGroup;
        }

        // ===== ROUNDED BOX GEOMETRY =====
        function createRoundedBoxGeometry(width, height, depth, radius) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const positionAttribute = geometry.getAttribute('position');
            const positions = positionAttribute.array;

            for (let i = 0; i < positions.length; i += 3) {
                const x = positions[i];
                const y = positions[i + 1];
                const z = positions[i + 2];

                positions[i] = Math.sign(x) * (Math.abs(x) - radius / 10);
                positions[i + 1] = Math.sign(y) * (Math.abs(y) - radius / 10);
                positions[i + 2] = Math.sign(z) * (Math.abs(z) - radius / 10);
            }

            positionAttribute.needsUpdate = true;
            geometry.computeVertexNormals();
            return geometry;
        }

        // ===== CREATE SHOCKWAVE RING =====
        function createShockwaveRing() {
            const ringGeometry = new THREE.TorusGeometry(1, 0.2, 16, 16);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: 0x00f5ff,
                emissive: 0x00f5ff,
                transparent: true,
                opacity: 0
            });
            shockwaveRing = new THREE.Mesh(ringGeometry, ringMaterial);
            shockwaveRing.position.copy(card.position);
            shockwaveRing.rotation.x = Math.PI / 2;
            scene.add(shockwaveRing);
        }

        // ===== ENTRY SEQUENCE =====
        function triggerEntrySequence() {
            // Reset card position for fly-in
            card.position.z = -30;
            card.rotation.y = 0;
            card.scale.set(0.3, 0.3, 0.3);

            // Fly-in with 360 flip
            gsap.timeline()
                .to(card.position, {
                    z: 0,
                    duration: 2,
                    ease: 'power3.out'
                }, 0)
                .to(card.rotation, {
                    y: Math.PI * 2,
                    duration: 2,
                    ease: 'power2.inOut'
                }, 0)
                .to(card.scale, {
                    x: 1,
                    y: 1,
                    z: 1,
                    duration: 2,
                    ease: 'back.out'
                }, 0)
                .call(() => {
                    triggerLandingEffect();
                    startIdleAnimation();
                }, null, 2);
        }

        // ===== LANDING EFFECT =====
        function triggerLandingEffect() {
            // Camera shake
            const originalPos = { x: camera.position.x, y: camera.position.y, z: camera.position.z };
            gsap.timeline()
                .to(camera.position, {
                    x: originalPos.x + (Math.random() - 0.5) * 0.3,
                    y: originalPos.y + (Math.random() - 0.5) * 0.3,
                    z: originalPos.z + (Math.random() - 0.5) * 0.3,
                    duration: 0.05,
                    repeatDelay: 0.05,
                    repeat: 10,
                    onComplete: () => {
                        camera.position.copy(originalPos);
                    }
                }, 0);

            // Glow pulse
            const cardLight = card.children.find(c => c instanceof THREE.Light);
            if (cardLight) {
                gsap.to(cardLight, {
                    intensity: 2,
                    duration: 0.4,
                    yoyo: true,
                    repeat: 1,
                    ease: 'power2.inOut'
                });
            }
        }

        // ===== IDLE ANIMATION =====
        function startIdleAnimation() {
            gsap.timeline({ repeat: -1 })
                .to(card.position, {
                    y: 1.3,
                    duration: 3,
                    ease: 'sine.inOut'
                }, 0)
                .to(card.position, {
                    y: 1,
                    duration: 3,
                    ease: 'sine.inOut'
                }, 3)
                .to(card.rotation, {
                    z: Math.sin(Date.now() * 0.001) * 0.1,
                    duration: 4,
                    ease: 'sine.inOut'
                }, 0, '<');
        }

        // ===== MOUSE MOVE (PARALLAX TILT) =====
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Tilt card towards mouse
            const targetRotX = mouse.y * 0.15;
            const targetRotY = mouse.x * 0.15;

            gsap.to(card.rotation, {
                x: targetRotX,
                y: targetRotY,
                duration: 0.3,
                overwrite: 'auto'
            });

            // Subtle camera tilt (restricted)
            gsap.to(camera, {
                'position.x': mouse.x * 2,
                'position.y': 2 + mouse.y * 1,
                duration: 0.5,
                ease: 'power2.out',
                overwrite: 'auto'
            });
        }

        // ===== CARD CLICK =====
        function onCardClick() {
            // Jump forward
            gsap.timeline()
                .to(card.position, {
                    y: '+=1.5',
                    duration: 0.3,
                    ease: 'power2.out'
                }, 0)
                .to(card.position, {
                    y: 1,
                    duration: 0.3,
                    ease: 'bounce.out'
                }, 0.3);

            // Shockwave
            triggerShockwave();

            // Click sound simulation
            console.log('Card Selected!');
        }

        // ===== SHOCKWAVE EFFECT =====
        function triggerShockwave() {
            shockwaveRing.scale.set(1, 1, 1);
            shockwaveRing.material.opacity = 1;

            gsap.timeline()
                .to(shockwaveRing.scale, {
                    x: 4,
                    y: 4,
                    z: 4,
                    duration: 0.6,
                    ease: 'power2.out'
                }, 0)
                .to(shockwaveRing.material, {
                    opacity: 0,
                    duration: 0.6,
                    ease: 'power2.out'
                }, 0);
        }

        // ===== NAVIGATION =====
        window.previousCard = function() {
            currentCardIndex = (currentCardIndex - 1 + CARD_DATA.length) % CARD_DATA.length;
            updateCard();
        };

        window.nextCard = function() {
            currentCardIndex = (currentCardIndex + 1) % CARD_DATA.length;
            updateCard();
        };

        function updateCard() {
            scene.remove(card);
            createCard();
            triggerEntrySequence();
            updateCardName();
        }

        function updateCardName() {
            document.getElementById('cardName').textContent = CARD_DATA[currentCardIndex].name;
        }

        // ===== RESIZE =====
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ===== ANIMATION LOOP =====
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // ===== START =====
        window.addEventListener('load', init);
    </script>
</body>
</html>
