<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAFIA 3SHI - PHASE 3: CINEMATIC CARD STORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            font-family: 'Tajawal', Arial, sans-serif;
            background: #0a0e27;
            overflow: hidden;
        }
        
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
        }
        
        .hud-header {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            pointer-events: auto;
        }
        
        .store-title {
            font-size: 40px;
            font-weight: 900;
            background: linear-gradient(90deg, #ff006e, #00f5ff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(255, 1, 110, 0.5);
        }
        
        .player-coins {
            background: rgba(255, 215, 0, 0.15);
            border: 2px solid #ffd700;
            padding: 12px 28px;
            border-radius: 10px;
            color: #ffd700;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        
        .card-info-panel {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 14, 39, 0.9);
            border: 2px solid #00f5ff;
            padding: 20px 40px;
            border-radius: 15px;
            text-align: center;
            pointer-events: auto;
            min-width: 400px;
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.3);
        }
        
        .card-title {
            font-size: 28px;
            font-weight: 900;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        
        .card-description {
            font-size: 14px;
            color: rgba(241, 250, 238, 0.7);
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        
        .card-price {
            font-size: 24px;
            font-weight: 800;
            color: #ff006e;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        
        .purchase-button {
            padding: 12px 32px;
            background: linear-gradient(135deg, #ff006e, #ff3366);
            border: 2px solid #00f5ff;
            color: white;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 1, 110, 0.4);
            letter-spacing: 1px;
        }
        
        .purchase-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(255, 1, 110, 0.7);
        }
        
        .collection-badge {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 80px;
            height: 80px;
            background: rgba(255, 1, 110, 0.2);
            border: 2px solid #ff006e;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff006e;
            font-size: 40px;
            font-weight: 900;
            box-shadow: 0 0 20px rgba(255, 1, 110, 0.3);
            pointer-events: auto;
        }
        
        .slide-hint {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0, 245, 255, 0.5);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: slideHintPulse 2s ease-in-out infinite;
        }
        
        @keyframes slideHintPulse {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.8;
            }
        }
        
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="ui">
        <div class="hud-header">
            <div class="store-title">🎭 CARD STORE 🎭</div>
            <div class="player-coins" id="playerCoins">💰 5000 COINS</div>
        </div>
        <div class="collection-badge" id="collectionBadge" title="Open Collection">📦</div>
        
        <div class="card-info-panel" id="cardInfoPanel">
            <div class="card-title" id="cardTitle">SHEIKH MAFIA</div>
            <div class="card-description" id="cardDescription">Legendary holographic card with VIP status</div>
            <div class="card-price" id="cardPrice">💰 500 COINS</div>
            <button class="purchase-button" onclick="purchaseCard()">🎁 PURCHASE</button>
        </div>
        
        <div class="slide-hint">⬅️ DRAG TO SCROLL / اسحب للتمرير ➡️</div>
    </div>
    
    <div class="flash-overlay" id="flashOverlay"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        // ===== CARD DATA =====
        const CARD_PACKS = [
            {
                id: 0,
                name: 'STARTER PACK',
                title: 'Starter Pack',
                description: 'Perfect for beginners - 5 common cards',
                price: 100,
                color: 0x4169E1,
                emoji: '🎪',
                rarity: 'Common'
            },
            {
                id: 1,
                name: 'CLASSIC COLLECTION',
                title: 'Classic Collection',
                description: 'Mix of rare and uncommon cards',
                price: 300,
                color: 0xFF8C00,
                emoji: '🎭',
                rarity: 'Rare'
            },
            {
                id: 2,
                name: 'SHEIKH MAFIA',
                title: 'Sheikh Mafia',
                description: 'Legendary holographic card with VIP status',
                price: 500,
                color: 0xFFD700,
                emoji: '👑',
                rarity: 'Legendary'
            },
            {
                id: 3,
                name: 'CHAOS EDITION',
                title: 'Chaos Edition',
                description: 'Ultra-rare foil collection - Limited time!',
                price: 750,
                color: 0xFF1493,
                emoji: '⚡',
                rarity: 'Mythic'
            },
            {
                id: 4,
                name: 'INFINITY SET',
                title: 'Infinity Set',
                description: 'Cosmic holographic masterpiece',
                price: 1000,
                color: 0x9932CC,
                emoji: '✨',
                rarity: 'Cosmic'
            },
            {
                id: 5,
                name: 'SHADOW LEGACY',
                title: 'Shadow Legacy',
                description: 'Dark matter collector\'s edition',
                price: 600,
                color: 0x2F4F4F,
                emoji: '🌑',
                rarity: 'Rare'
            },
            {
                id: 6,
                name: 'PHOENIX RISING',
                title: 'Phoenix Rising',
                description: 'Fiery foil with animated hologram',
                price: 800,
                color: 0xFF4500,
                emoji: '🔥',
                rarity: 'Legendary'
            }
        ];

        // ===== GLOBAL STATE =====
        let gameState = {
            playerCoins: 5000,
            collection: [],
            currentFocusIndex: 2,
            carouselPosition: 0,
            isDragging: false,
            dragVelocity: 0,
            lastDragX: 0
        };

        // ===== THREE.JS OBJECTS =====
        let scene, camera, renderer;
        let carouselGroup;
        let cardMeshes = [];
        let godRayLight;
        let focusedCard = null;
        let cameraLight;

        // ===== INITIALIZATION =====
        function init() {
            setupScene();
            setupLights();
            setupBackground();
            createCarousel();
            setupEvents();
            animate();
            updateCardInfo(CARD_PACKS[gameState.currentFocusIndex]);
            
            console.log('Phase 3: Cinematic Card Store & Collection');
            console.log('🎭 Drag the carousel to browse cards');
            console.log('👆 Click PURCHASE to buy the focused card');
            console.log('🎁 Cards will fly to collection on purchase');
        }

        function setupScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e27);
            scene.fog = new THREE.Fog(0x0a0e27, 100, 300);

            camera = new THREE.PerspectiveCamera(
                70,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 2, 15);
            camera.lookAt(0, 1.5, 0);

            renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('canvas'),
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFShadowShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
        }

        function setupLights() {
            // Ambient light
            const ambientLight = new THREE.AmbientLight(0x1a2a5c, 0.5);
            scene.add(ambientLight);

            // Main spotlight
            const mainSpotlight = new THREE.SpotLight(0x00f5ff, 1.5, 150, Math.PI / 2.2, 0.4, 2);
            mainSpotlight.position.set(0, 20, 10);
            mainSpotlight.target.position.set(0, 1.5, 0);
            mainSpotlight.castShadow = true;
            mainSpotlight.shadow.mapSize.width = 2048;
            mainSpotlight.shadow.mapSize.height = 2048;
            scene.add(mainSpotlight);
            scene.add(mainSpotlight.target);

            // Side neon lights
            const neonLight1 = new THREE.PointLight(0xff006e, 1.2, 80);
            neonLight1.position.set(15, 5, 5);
            scene.add(neonLight1);

            const neonLight2 = new THREE.PointLight(0x00f5ff, 1.2, 80);
            neonLight2.position.set(-15, 5, 5);
            scene.add(neonLight2);

            // God ray light (for focused card)
            godRayLight = new THREE.PointLight(0xffd700, 2, 50);
            godRayLight.position.set(0, 8, 2);
            godRayLight.intensity = 0;
            scene.add(godRayLight);

            // Camera light (follows focused card)
            cameraLight = new THREE.PointLight(0x00f5ff, 0.8, 30);
            cameraLight.position.set(0, 3, 12);
            scene.add(cameraLight);
        }

        function setupBackground() {
            const tableGeometry = new THREE.PlaneGeometry(100, 100);
            const tableMaterial = new THREE.MeshStandardMaterial({
                color: 0x0a0e27,
                roughness: 0.95,
                metalness: 0.02,
                emissive: 0x0f1528,
                emissiveIntensity: 0.2
            });
            const table = new THREE.Mesh(tableGeometry, tableMaterial);
            table.rotation.x = -Math.PI / 2;
            table.position.y = -0.5;
            table.receiveShadow = true;
            scene.add(table);
        }

        function createCarousel() {
            carouselGroup = new THREE.Group();
            scene.add(carouselGroup);

            CARD_PACKS.forEach((cardData, index) => {
                const cardMesh = createCard(cardData, index);
                carouselGroup.add(cardMesh);
                cardMeshes.push(cardMesh);
            });

            updateCarouselLayout();
        }

        function createCard(cardData, index) {
            const cardGroup = new THREE.Group();
            cardGroup.userData = {
                packData: cardData,
                index: index,
                originalScale: 1
            };

            // Card body
            const cardGeometry = new THREE.BoxGeometry(3, 4.2, 0.15);
            const cardMaterial = new THREE.MeshStandardMaterial({
                color: cardData.color,
                roughness: 0.2,
                metalness: 0.8,
                emissive: cardData.color,
                emissiveIntensity: 0.3
            });
            const cardMesh = new THREE.Mesh(cardGeometry, cardMaterial);
            cardMesh.castShadow = true;
            cardMesh.receiveShadow = true;
            cardGroup.add(cardMesh);

            // Glowing border
            const borderGeometry = new THREE.BoxGeometry(3.15, 4.35, 0.1);
            const borderMaterial = new THREE.MeshStandardMaterial({
                color: cardData.color,
                emissive: cardData.color,
                emissiveIntensity: 0.6,
                roughness: 0.15,
                metalness: 1
            });
            const borderMesh = new THREE.Mesh(borderGeometry, borderMaterial);
            borderMesh.position.z = 0.08;
            borderMesh.castShadow = true;
            cardGroup.add(borderMesh);

            // Card artwork (canvas texture with holographic effect)
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 360;
            const ctx = canvas.getContext('2d');
            
            // Gradient background
            const gradient = ctx.createLinearGradient(0, 0, 256, 360);
            gradient.addColorStop(0, cardData.rarity === 'Legendary' ? '#1a1a2e' : '#0a1e3a');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 256, 360);

            // Holographic shimmer overlay
            for (let i = 0; i < 15; i++) {
                ctx.fillStyle = `rgba(255, 255, 255, ${0.1 - i * 0.003})`;
                ctx.fillRect(i * 20, 0, 5, 360);
            }

            // Rarity indicator
            ctx.font = 'bold 14px Tajawal, Arial';
            ctx.fillStyle = cardData.rarity === 'Mythic' ? '#FF1493' : cardData.rarity === 'Legendary' ? '#FFD700' : '#00f5ff';
            ctx.textAlign = 'center';
            ctx.fillText(cardData.rarity.toUpperCase(), 128, 30);

            // Emoji
            ctx.font = 'bold 100px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(cardData.emoji, 128, 140);

            // Card title
            ctx.font = 'bold 20px Tajawal, Arial';
            ctx.fillStyle = '#ffd700';
            ctx.textAlign = 'center';
            wrapText(ctx, cardData.name, 128, 260, 230, 25);

            // Price indicator
            ctx.font = 'bold 16px Tajawal, Arial';
            ctx.fillStyle = '#ff006e';
            ctx.fillText('💰 ' + cardData.price, 128, 320);

            const texture = new THREE.CanvasTexture(canvas);
            const frontMaterial = new THREE.MeshStandardMaterial({
                map: texture,
                emissive: 0x00f5ff,
                emissiveIntensity: 0.15,
                roughness: 0.3,
                metalness: 0.7
            });

            const frontGeometry = new THREE.PlaneGeometry(2.9, 4.1);
            const frontMesh = new THREE.Mesh(frontGeometry, frontMaterial);
            frontMesh.position.z = 0.1;
            frontMesh.castShadow = true;
            cardGroup.add(frontMesh);

            // Card glow light
            const cardLight = new THREE.PointLight(cardData.color, 0.5, 15);
            cardLight.position.z = 2;
            cardGroup.add(cardLight);

            cardGroup.userData.cardLight = cardLight;
            cardGroup.userData.borderMesh = borderMesh;

            return cardGroup;
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';

            words.forEach(word => {
                const testLine = line + (line ? ' ' : '') + word;
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && line) {
                    ctx.fillText(line, x, y);
                    line = word;
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            });
            ctx.fillText(line, x, y);
        }

        function updateCarouselLayout() {
            const spacing = 5;
            const focusScale = 1.5;
            const sideScale = 0.9;

            cardMeshes.forEach((card, index) => {
                const offset = index - gameState.currentFocusIndex;
                const targetX = offset * spacing;
                const isCenter = offset === 0;
                const targetScale = isCenter ? focusScale : sideScale;
                const targetRotY = offset * 0.3 * (offset < 0 ? 1 : -1);

                gsap.to(card.position, {
                    x: targetX,
                    duration: 0.8,
                    ease: 'power3.out'
                });

                gsap.to(card.scale, {
                    x: targetScale,
                    y: targetScale,
                    z: targetScale,
                    duration: 0.8,
                    ease: 'power3.out'
                });

                gsap.to(card.rotation, {
                    y: targetRotY,
                    duration: 0.8,
                    ease: 'power3.out'
                });

                // Glow intensity
                const targetGlow = isCenter ? 1.2 : 0.4;
                gsap.to(card.userData.cardLight, {
                    intensity: targetGlow,
                    duration: 0.8,
                    ease: 'power3.out'
                });

                // God ray for focused card
                if (isCenter) {
                    focusedCard = card;
                    gsap.to(godRayLight, {
                        intensity: 2.5,
                        duration: 0.6
                    });
                    startCardSpin(card);
                } else {
                    gsap.to(godRayLight, {
                        intensity: 0,
                        duration: 0.6
                    });
                }
            });
        }

        function startCardSpin(card) {
            gsap.to(card.rotation, {
                y: '+=6.28',
                duration: 6,
                ease: 'none',
                overwrite: 'auto'
            });
        }

        function setupEvents() {
            document.addEventListener('mousedown', onDragStart);
            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('mouseup', onDragEnd);
            document.addEventListener('wheel', onMouseWheel, { passive: false });
            window.addEventListener('resize', onWindowResize);
        }

        function onDragStart(event) {
            if (event.target.tagName === 'BUTTON') return;
            gameState.isDragging = true;
            gameState.lastDragX = event.clientX;
            gameState.dragVelocity = 0;
        }

        function onDragMove(event) {
            if (!gameState.isDragging) return;

            const delta = event.clientX - gameState.lastDragX;
            gameState.dragVelocity = delta * 0.1;
            gameState.carouselPosition += delta;
            gameState.lastDragX = event.clientX;

            // Visual feedback during drag
            const sensitivity = 0.02;
            cardMeshes.forEach((card, index) => {
                const offset = index - gameState.currentFocusIndex + gameState.carouselPosition * sensitivity;
                gsap.to(card.position, {
                    x: offset * 5,
                    duration: 0,
                    overwrite: 'auto'
                });
            });
        }

        function onDragEnd(event) {
            gameState.isDragging = false;

            // Snap to nearest card with inertia
            const momentum = gameState.dragVelocity;
            const threshold = 1;

            if (Math.abs(momentum) > threshold) {
                const direction = momentum > 0 ? -1 : 1;
                gameState.currentFocusIndex = Math.max(
                    0,
                    Math.min(
                        gameState.currentFocusIndex + direction,
                        cardMeshes.length - 1
                    )
                );
            } else {
                const amountToNextCard = gameState.carouselPosition % 5;
                if (Math.abs(amountToNextCard) > 2.5) {
                    const direction = amountToNextCard > 0 ? -1 : 1;
                    gameState.currentFocusIndex = Math.max(
                        0,
                        Math.min(
                            gameState.currentFocusIndex + direction,
                            cardMeshes.length - 1
                        )
                    );
                }
            }

            gameState.carouselPosition = 0;
            updateCarouselLayout();
            updateCardInfo(CARD_PACKS[gameState.currentFocusIndex]);
        }

        function onMouseWheel(event) {
            event.preventDefault();
            const direction = event.deltaY > 0 ? 1 : -1;
            gameState.currentFocusIndex = Math.max(
                0,
                Math.min(
                    gameState.currentFocusIndex + direction,
                    cardMeshes.length - 1
                )
            );
            updateCarouselLayout();
            updateCardInfo(CARD_PACKS[gameState.currentFocusIndex]);
        }

        function updateCardInfo(cardData) {
            document.getElementById('cardTitle').textContent = cardData.title;
            document.getElementById('cardDescription').textContent = cardData.description;
            document.getElementById('cardPrice').textContent = `💰 ${cardData.price} COINS`;
        }

        // ===== PURCHASE ANIMATION =====
        function purchaseCard() {
            if (!focusedCard) return;

            const cardData = focusedCard.userData.packData;

            if (gameState.playerCoins < cardData.price) {
                alert('❌ Not enough coins!');
                return;
            }

            gameState.playerCoins -= cardData.price;
            document.getElementById('playerCoins').textContent = `💰 ${gameState.playerCoins} COINS`;

            // Card shake (charging energy)
            const timeline = gsap.timeline();

            // Violent shake
            timeline.to(focusedCard.position, {
                x: '+=0.2',
                duration: 0.1,
                yoyo: true,
                repeat: 15,
                ease: 'power2.inOut'
            });

            // White flash
            timeline.to(
                document.getElementById('flashOverlay'),
                {
                    opacity: 1,
                    duration: 0.05
                },
                0.3
            );

            timeline.to(
                document.getElementById('flashOverlay'),
                {
                    opacity: 0,
                    duration: 0.3
                },
                0.35
            );

            // Explode into particles
            timeline.call(() => {
                createParticleExplosion(focusedCard, cardData);
            }, null, 1.5);
        }

        function createParticleExplosion(sourceCard, cardData) {
            const particleCount = 10;
            const targetButton = document.getElementById('collectionBadge');
            const targetRect = targetButton.getBoundingClientRect();
            const targetWorldPos = new THREE.Vector3(
                (targetRect.left / window.innerWidth) * 2 - 1,
                -(targetRect.top / window.innerHeight) * 2 + 1,
                5
            );

            for (let i = 0; i < particleCount; i++) {
                const particleGeometry = new THREE.BoxGeometry(0.3, 0.3, 0.1);
                const particleMaterial = new THREE.MeshStandardMaterial({
                    color: cardData.color,
                    emissive: cardData.color,
                    emissiveIntensity: 0.8,
                    roughness: 0.2,
                    metalness: 0.9
                });
                const particle = new THREE.Mesh(particleGeometry, particleMaterial);
                particle.position.copy(sourceCard.position);
                particle.castShadow = true;
                scene.add(particle);

                const angle = (i / particleCount) * Math.PI * 2;
                const velocity = {
                    x: Math.cos(angle) * (2 + Math.random() * 3),
                    y: Math.sin(angle) * (2 + Math.random() * 3) + 1,
                    z: (Math.random() - 0.5) * 2
                };

                gsap.to(particle.position, {
                    x: targetWorldPos.x * 20,
                    y: targetWorldPos.y * 15 + 3,
                    z: targetWorldPos.z,
                    duration: 0.8,
                    ease: 'cubic.out'
                });

                gsap.to(particle.rotation, {
                    x: Math.random() * Math.PI * 2,
                    y: Math.random() * Math.PI * 2,
                    z: Math.random() * Math.PI * 2,
                    duration: 0.8
                });

                gsap.to(particle.scale, {
                    x: 0,
                    y: 0,
                    z: 0,
                    duration: 0.8,
                    onComplete: () => {
                        scene.remove(particle);
                    }
                });
            }

            // Add to collection
            gameState.collection.push(cardData);
            console.log('Added to collection:', cardData.name);
            console.log('Total cards owned:', gameState.collection.length);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Update holographic shimmer (optional: rotate cards slightly for shimmer effect)
            if (focusedCard && !gameState.isDragging) {
                focusedCard.rotation.z = Math.sin(Date.now() * 0.003) * 0.05;
            }

            renderer.render(scene, camera);
        }

        // ===== START =====
        window.addEventListener('load', init);
    </script>
</body>
</html>
